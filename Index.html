<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💬 Lumina Chat | Decentralized</title>
  
  <!-- Tailwind CSS & PeerJS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.1/dist/peerjs.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      overflow: hidden;
      background-color: #0b0e1a;
      transition: background-color 3s ease;
    }

    /* Environment Layers */
    #env-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-gradient-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      transition: all 4s ease-in-out;
      opacity: 0.6;
    }

    /* Weather Elements */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      animation: twinkle linear infinite;
      opacity: 0;
      transition: opacity 2s ease;
    }
    
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      filter: blur(40px);
      animation: float linear infinite;
      transition: opacity 2s ease;
    }

    .raindrop {
      position: absolute;
      width: 2px;
      height: 100px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3));
      animation: fall linear infinite;
      opacity: 0;
      transition: opacity 1s ease;
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.8); opacity: 0.2; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    @keyframes float {
      from { transform: translateX(-10vw); }
      to { transform: translateX(110vw); }
    }
    @keyframes fall {
      from { transform: translateY(-100px); }
      to { transform: translateY(110vh); }
    }

    /* UI Glassmorphism */
    .glass-panel {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: border-color 1s ease, background 1s ease;
    }

    .message-bubble {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Room Type Cards */
    .room-type-card {
      transition: all 0.2s ease;
    }
    .room-type-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .room-type-card.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-3 sm:p-4">

  <!-- Living Environment Layer -->
  <div id="env-layer">
    <div id="grad1" class="bg-gradient-sphere w-[60vw] h-[60vw] top-[-10%] left-[-10%] bg-blue-900"></div>
    <div id="grad2" class="bg-gradient-sphere w-[50vw] h-[50vw] bottom-[-10%] right-[-10%] bg-purple-900"></div>
    <div id="grad3" class="bg-gradient-sphere w-[40vw] h-[40vw] top-[40%] left-[30%] bg-indigo-900"></div>
    <div id="starsLayer" class="absolute inset-0"></div>
    <div id="cloudsLayer" class="absolute inset-0"></div>
    <div id="rainLayer" class="absolute inset-0"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[60] transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4 glass-panel px-6 py-3 rounded-full flex items-center gap-2 shadow-2xl">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMsg" class="text-sm font-medium">Notification</span>
  </div>

  <!-- Invalid Link Modal -->
  <div id="invalidModal" class="fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center">
    <div class="glass-panel p-6 rounded-2xl max-w-sm w-full text-center mx-4">
      <div class="text-4xl mb-4">🕵️</div>
      <h3 class="text-xl font-bold mb-2">Secret Room</h3>
      <p class="text-slate-300 text-sm mb-6">This invitation is invalid or has expired.</p>
      <button onclick="document.getElementById('invalidModal').classList.add('hidden')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 rounded-xl transition-all">
        Got it
      </button>
    </div>
  </div>

  <!-- Chat Container -->
  <div id="appContainer" class="glass-panel w-full max-w-3xl h-[95vh] sm:h-[85vh] max-h-[850px] rounded-3xl flex flex-col relative overflow-hidden transition-all duration-700 shadow-2xl shadow-black/50">
    
    <!-- Login Overlay -->
    <div id="loginScreen" class="absolute inset-0 z-40 bg-slate-900/85 backdrop-blur-2xl flex flex-col items-center justify-center p-6 overflow-y-auto transition-opacity duration-700">
      <div class="text-5xl mb-4 drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">✨</div>
      <h1 class="text-3xl font-bold mb-1 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Lumina Chat</h1>
      <p class="text-slate-400 mb-6 text-xs font-medium tracking-widest uppercase">Decentralized Living Rooms</p>
      
      <div class="w-full max-w-md space-y-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1 ml-1">Nickname</label>
          <input type="text" id="usernameInput" placeholder="e.g. Alex" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" maxlength="15">
        </div>
        <div id="roomInputContainer">
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1 ml-1">Room Name</label>
          <input type="text" id="roomInput" value="Global" placeholder="e.g. Global" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" maxlength="20">
        </div>
      </div>

      <!-- Room Type Selector -->
      <div id="roomTypeSelector" class="w-full max-w-md">
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Choose Room Type</label>
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3">
          <div class="room-type-card active glass-panel p-2 rounded-xl cursor-pointer flex flex-col items-center text-center gap-1" data-type="public">
            <span class="text-lg">🌍</span>
            <span class="text-[10px] font-bold text-slate-200">Public</span>
          </div>
          <div class="room-type-card glass-panel p-2 rounded-xl cursor-pointer flex flex-col items-center text-center gap-1" data-type="secret">
            <span class="text-lg">🕵️</span>
            <span class="text-[10px] font-bold text-slate-200">Secret</span>
          </div>
          <div class="room-type-card glass-panel p-2 rounded-xl cursor-pointer flex flex-col items-center text-center gap-1" data-type="onetime">
            <span class="text-lg">⚡</span>
            <span class="text-[10px] font-bold text-slate-200">One-Time</span>
          </div>
          <div class="room-type-card glass-panel p-2 rounded-xl cursor-pointer flex flex-col items-center text-center gap-1" data-type="ghost">
            <span class="text-lg">👻</span>
            <span class="text-[10px] font-bold text-slate-200">Ghost</span>
          </div>
          <div class="room-type-card glass-panel p-2 rounded-xl cursor-pointer flex flex-col items-center text-center gap-1" data-type="vault">
            <span class="text-lg">🔐</span>
            <span class="text-[10px] font-bold text-slate-200">Vault</span>
          </div>
        </div>
        <div id="dynamicOptions" class="h-8 flex items-center justify-center text-xs text-slate-400 mb-2">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div class="w-full max-w-md mt-2">
        <button id="joinBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold py-3.5 rounded-xl shadow-[0_0_20px_rgba(59,130,246,0.3)] transition-all hover:-translate-y-0.5 active:translate-y-0 text-sm tracking-wide">
          Enter Room
        </button>
        <p id="connectionStatus" class="mt-4 text-xs text-yellow-400 h-4 text-center font-medium"></p>
      </div>
    </div>

    <!-- Header -->
    <header class="border-b border-white/5 p-4 flex justify-between items-center bg-black/20 backdrop-blur-md shrink-0 z-10">
      <div class="flex items-center gap-3">
        <div class="relative flex h-2.5 w-2.5 flex-shrink-0">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
        </div>
        <h2 class="font-bold text-sm sm:text-base tracking-wide flex items-center gap-2 truncate">
          <span id="roomDisplay" class="truncate max-w-[100px] sm:max-w-[200px]">Room</span>
          <span id="roomTypeBadge" class="bg-white/10 text-[9px] sm:text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider text-slate-300 flex-shrink-0">🌍 PUBLIC</span>
        </h2>
      </div>
      <div class="flex gap-2 items-center flex-shrink-0">
        <button id="inviteBtn" class="bg-blue-500/20 hover:bg-blue-500/40 text-blue-300 border border-blue-500/30 px-3 py-1 rounded-full text-xs font-semibold transition-all flex items-center gap-1">
          🔗 <span class="hidden sm:inline">Invite</span>
        </button>
        <span id="peerCount" class="bg-white/10 border border-white/10 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1" title="Connected Peers">
          👤 <span id="countNum">1</span>
        </span>
      </div>
    </header>

    <!-- Messages -->
    <main id="chatWindow" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col scroll-smooth relative z-10">
      <!-- Messages populate here -->
    </main>

    <!-- Input Area -->
    <footer class="p-4 border-t border-white/5 bg-black/20 backdrop-blur-md shrink-0 z-10">
      <form id="chatForm" class="flex gap-2 relative">
        <input type="text" id="msgInput" placeholder="Type your message..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-full px-5 py-3 text-sm focus:outline-none focus:border-blue-500 focus:bg-white/10 transition-all text-white placeholder-slate-400">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white rounded-full px-5 sm:px-6 py-3 font-semibold text-sm transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)] flex-shrink-0">
          Send
        </button>
      </form>
    </footer>
  </div>

  <script>
    // --- Environment Engine ---
    class LivingEnvironment {
      constructor() {
        this.layers = {
          stars: document.getElementById('starsLayer'),
          clouds: document.getElementById('cloudsLayer'),
          rain: document.getElementById('rainLayer')
        };
        this.grads = [
          document.getElementById('grad1'),
          document.getElementById('grad2'),
          document.getElementById('grad3')
        ];
        this.lastActiveTime = Date.now();
        this.roomPhase = 0;
        this.isRaining = false;
        
        this.initElements();
        setInterval(() => this.tick(), 1000);
      }

      initElements() {
        // Build Stars
        for(let i=0; i<40; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.width = Math.random() * 3 + 'px';
          star.style.height = star.style.width;
          star.style.left = Math.random() * 100 + 'vw';
          star.style.top = Math.random() * 100 + 'vh';
          star.style.animationDuration = (Math.random() * 3 + 2) + 's';
          star.style.animationDelay = Math.random() * 2 + 's';
          this.layers.stars.appendChild(star);
        }
        
        // Build Clouds
        for(let i=0; i<4; i++) {
          const cloud = document.createElement('div');
          cloud.className = 'cloud';
          cloud.style.width = (Math.random() * 200 + 150) + 'px';
          cloud.style.height = (Math.random() * 60 + 40) + 'px';
          cloud.style.top = Math.random() * 40 + 'vh';
          cloud.style.animationDuration = (Math.random() * 40 + 40) + 's';
          cloud.style.animationDelay = -(Math.random() * 40) + 's';
          this.layers.clouds.appendChild(cloud);
        }

        // Build Rain
        for(let i=0; i<60; i++) {
          const drop = document.createElement('div');
          drop.className = 'raindrop';
          drop.style.left = Math.random() * 100 + 'vw';
          drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
          drop.style.animationDelay = Math.random() * 2 + 's';
          this.layers.rain.appendChild(drop);
        }
      }

      setTheme(roomName) {
        const name = roomName.toLowerCase();
        // Dynamic Room Parsing
        if (name.includes('night') || name.includes('chennai') || name.includes('dark') || name.includes('moon')) {
          this.grads[0].style.backgroundColor = '#1e3a8a';
          this.grads[1].style.backgroundColor = '#4c1d95';
          this.grads[2].style.backgroundColor = '#0f172a';
          Array.from(this.layers.stars.children).forEach(s => s.style.opacity = '1');
          Array.from(this.layers.clouds.children).forEach(c => c.style.opacity = '1');
        } else if (name.includes('sunset') || name.includes('evening') || name.includes('fire') || name.includes('dusk')) {
          this.grads[0].style.backgroundColor = '#9a3412';
          this.grads[1].style.backgroundColor = '#831843';
          this.grads[2].style.backgroundColor = '#312e81';
          Array.from(this.layers.stars.children).forEach(s => s.style.opacity = '0');
          Array.from(this.layers.clouds.children).forEach(c => c.style.opacity = '1');
        } else {
          // Default
          this.grads[0].style.backgroundColor = '#0369a1';
          this.grads[1].style.backgroundColor = '#1d4ed8';
          this.grads[2].style.backgroundColor = '#0f172a';
          Array.from(this.layers.stars.children).forEach(s => s.style.opacity = '0');
          Array.from(this.layers.clouds.children).forEach(c => c.style.opacity = '0');
        }
        this.roomPhase = 0;
        this.ping();
      }

      ping() {
        this.lastActiveTime = Date.now();
        if (this.isRaining) {
          this.isRaining = false;
          Array.from(this.layers.rain.children).forEach(r => r.style.opacity = '0');
          document.getElementById('appContainer').style.borderColor = 'rgba(255, 255, 255, 0.08)';
        }
      }

      tick() {
        const inactiveSeconds = (Date.now() - this.lastActiveTime) / 1000;
        // Apply rain after 15 seconds of silence
        if (inactiveSeconds > 15 && !this.isRaining) {
          this.isRaining = true;
          Array.from(this.layers.rain.children).forEach(r => r.style.opacity = '0.6');
          document.getElementById('appContainer').style.borderColor = 'rgba(148, 163, 184, 0.3)';
        }
        // Deepen background over time
        if (inactiveSeconds > 30 && this.roomPhase === 0) {
          this.roomPhase = 1;
          document.body.style.backgroundColor = '#020617';
          this.grads[0].style.transform = 'scale(1.2) translate(-5vw, 5vh)';
        } else if (inactiveSeconds > 60 && this.roomPhase === 1) {
          this.roomPhase = 2;
          this.grads[1].style.transform = 'scale(1.5) translate(5vw, -5vh)';
        }
      }
    }

    const env = new LivingEnvironment();

    // --- STREAMING_CHUNK:Defining Logic and Network Handlers... ---
    const UI = {
      login: document.getElementById('loginScreen'),
      userIn: document.getElementById('usernameInput'),
      roomIn: document.getElementById('roomInput'),
      roomInCont: document.getElementById('roomInputContainer'),
      typeSelector: document.getElementById('roomTypeSelector'),
      dynOpts: document.getElementById('dynamicOptions'),
      joinBtn: document.getElementById('joinBtn'),
      status: document.getElementById('connectionStatus'),
      chat: document.getElementById('chatWindow'),
      form: document.getElementById('chatForm'),
      msgIn: document.getElementById('msgInput'),
      roomDisp: document.getElementById('roomDisplay'),
      roomBadge: document.getElementById('roomTypeBadge'),
      inviteBtn: document.getElementById('inviteBtn'),
      count: document.getElementById('countNum'),
      toast: document.getElementById('toast'),
      toastMsg: document.getElementById('toastMsg'),
      toastIcon: document.getElementById('toastIcon'),
      cards: document.querySelectorAll('.room-type-card')
    };

    let peer = null;
    let connections = {};
    let isHost = false;
    let myName = '';
    let roomName = '';
    let targetHostId = '';
    
    // Room Configuration States
    let roomType = 'public';
    let roomSecretKey = '';
    let roomInstanceId = '';
    let ghostDuration = 30;
    let isJoinViaLink = false;

    // Load saved preferences if available
    try {
        const savedName = localStorage.getItem('lumina_name');
        if (savedName) UI.userIn.value = savedName;
    } catch(e) {}

    const peerConfig = {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    };

    function parseURL() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('room')) {
        UI.roomIn.value = decodeURIComponent(params.get('room'));
        roomType = params.get('type') || 'public';
        isJoinViaLink = true;

        if (roomType === 'secret') {
          roomSecretKey = params.get('key');
          if (!roomSecretKey) {
            document.getElementById('invalidModal').classList.remove('hidden');
            roomType = 'public'; // Fallback so app still works
            isJoinViaLink = false;
          } else {
            // Lock UI to secret room
            UI.roomInCont.innerHTML = `<div class="bg-slate-800/80 border border-purple-500/50 rounded-xl px-4 py-3 text-purple-300 font-semibold flex items-center justify-center gap-2 shadow-inner"><span>🕵️</span> <span>Secret Room Invitation</span></div>`;
            UI.typeSelector.classList.add('hidden');
          }
        }
        if (roomType === 'onetime') roomInstanceId = params.get('inst');
        if (roomType === 'ghost') ghostDuration = parseInt(params.get('timer')) || 30;

        updateUICards();
      }
    }

    function generateCryptographicKey() {
      const array = new Uint8Array(16);
      crypto.getRandomValues(array);
      return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function generateInstanceId() {
      return Math.random().toString(36).substring(2, 12);
    }

    function updateUICards() {
      UI.cards.forEach(c => {
        if (c.dataset.type === roomType) c.classList.add('active');
        else c.classList.remove('active');
      });

      // Update Dynamic Help Text
      if (roomType === 'public') UI.dynOpts.innerHTML = 'Anyone with the room name can join.';
      if (roomType === 'secret') UI.dynOpts.innerHTML = 'Only people with your private invitation can enter.';
      if (roomType === 'onetime') UI.dynOpts.innerHTML = 'Temporary room that ends when everyone leaves.';
      if (roomType === 'vault') UI.dynOpts.innerHTML = 'Live peer chat with local-only history.';
      if (roomType === 'ghost') {
        UI.dynOpts.innerHTML = `
          <div class="flex items-center gap-2">
            <span>Message lifetime:</span>
            <select id="ghostTimerSelect" class="bg-slate-800/80 border border-slate-600 rounded px-2 py-1 text-white outline-none cursor-pointer">
              <option value="10" ${ghostDuration===10?'selected':''}>10s</option>
              <option value="30" ${ghostDuration===30?'selected':''}>30s</option>
              <option value="60" ${ghostDuration===60?'selected':''}>1m</option>
              <option value="300" ${ghostDuration===300?'selected':''}>5m</option>
              <option value="600" ${ghostDuration===600?'selected':''}>10m</option>
            </select>
          </div>
        `;
        document.getElementById('ghostTimerSelect').addEventListener('change', (e) => {
          ghostDuration = parseInt(e.target.value);
        });
      }
    }

    UI.cards.forEach(card => {
      card.addEventListener('click', () => {
        if(isJoinViaLink && roomType === 'secret') return; // Cannot switch away from required secret invite
        roomType = card.dataset.type;
        updateUICards();
      });
    });

    function showToast(msg, type = 'info') {
      UI.toastMsg.textContent = msg;
      UI.toastIcon.textContent = type === 'error' ? '⚠️' : type === 'success' ? '✅' : 'ℹ️';
      UI.toast.classList.remove('opacity-0', '-translate-y-4');
      setTimeout(() => UI.toast.classList.add('opacity-0', '-translate-y-4'), 2500);
    }

    function updateBadge() {
      let icon = '🌍'; let text = 'PUBLIC'; let bg = 'bg-blue-500/20 text-blue-300';
      if (roomType === 'secret') { icon = '🕵️'; text = 'SECRET'; bg = 'bg-purple-500/20 text-purple-300 border-purple-500/30'; }
      if (roomType === 'onetime') { icon = '⚡'; text = 'ONE-TIME'; bg = 'bg-yellow-500/20 text-yellow-300 border-yellow-500/30'; }
      if (roomType === 'ghost') { icon = '👻'; text = 'GHOST'; bg = 'bg-slate-500/20 text-slate-300 border-slate-500/30'; }
      if (roomType === 'vault') { icon = '🔐'; text = 'VAULT'; bg = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'; }
      
      UI.roomBadge.className = `text-[9px] sm:text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider border border-white/10 ${bg}`;
      UI.roomBadge.innerHTML = `${icon} <span class="hidden sm:inline">${text}</span>`;
      
      if(roomType === 'ghost') {
        UI.roomBadge.innerHTML += ` <span class="opacity-75 lowercase ml-1">(${ghostDuration}s)</span>`;
      }
    }

    // --- STREAMING_CHUNK:Message Rendering and WebRTC Connection... ---
    function addMessage(user, text, system = false, isSelf = false, expiresAt = null) {
      env.ping();
      
      const div = document.createElement('div');
      if (system) {
        div.className = 'text-center my-2 transition-all duration-500';
        div.innerHTML = `<span class="bg-white/5 border border-white/10 text-slate-400 text-xs px-3 py-1 rounded-full shadow-inner">${text}</span>`;
      } else {
        const hash = user.charCodeAt(0) % 360;
        const color = `hsl(${hash}, 70%, 65%)`;
        div.className = `message-bubble flex flex-col max-w-[85%] ${isSelf ? 'self-end items-end' : 'self-start items-start'}`;
        
        let timerHTML = '';
        if (roomType === 'ghost' && expiresAt) {
          const rem = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
          timerHTML = `<span class="ghost-timer text-[9px] font-mono text-slate-500 ml-2" data-expires="${expiresAt}">${rem}s</span>`;
        }

        div.innerHTML = `
          <div class="flex items-center mb-1 ml-1">
            <span class="text-[10px] font-semibold tracking-wide drop-shadow-md" style="color: ${isSelf ? '#cbd5e1' : color}">${user}</span>
            ${timerHTML}
          </div>
          <div class="px-4 py-2.5 text-sm leading-relaxed shadow-xl break-words w-full ${
            isSelf ? 'bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl rounded-tr-sm shadow-blue-900/30' 
                   : 'bg-slate-800/90 backdrop-blur-md text-slate-100 border border-white/10 rounded-2xl rounded-tl-sm shadow-black/20'
          }">
            ${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
          </div>
        `;

        if (roomType === 'ghost' && expiresAt) {
          const timerEl = div.querySelector('.ghost-timer');
          const interval = setInterval(() => {
            const rem = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
            if (timerEl) timerEl.textContent = `${rem}s`;
            if (rem <= 3 && timerEl) timerEl.classList.add('text-red-400', 'animate-pulse');
            
            if (rem <= 0) {
              clearInterval(interval);
              div.classList.add('opacity-0', 'scale-95');
              setTimeout(() => div.remove(), 350);
            }
          }, 1000);
        }
      }
      
      UI.chat.appendChild(div);
      UI.chat.scrollTop = UI.chat.scrollHeight;
      return div;
    }

    function updateCount() {
      const num = Object.keys(connections).length + 1;
      UI.count.textContent = num;
      if (roomType === 'onetime' && num === 1 && !isHost) {
          // Additional handling for one-time rooms if necessary.
      }
    }

    function broadcast(data) {
      Object.values(connections).forEach(conn => {
        if(conn.open) conn.send(data);
      });
    }

    function setupConnection(conn) {
      conn.on('data', data => {
        if (data.type === 'msg') {
          addMessage(data.user, data.text, false, false, data.expiresAt);
          if (isHost) broadcast(data);
        }
      });
      conn.on('close', () => {
        delete connections[conn.peer];
        updateCount();
        
        if (roomType === 'onetime' && Object.keys(connections).length === 0 && isHost) {
          addMessage('System', '⚡ This temporary room has ended.', true);
        }
        
        if(!isHost && conn.peer === targetHostId) {
          addMessage('System', 'Host disconnected. Migrating room...', true);
          setTimeout(initPeer, 1000);
        }
      });
    }

    function becomeHost() {
      if (peer) peer.destroy();
      isHost = true;
      UI.status.textContent = "Establishing local host...";
      
      peer = new Peer(targetHostId, peerConfig);
      
      peer.on('open', () => {
        UI.login.classList.add('opacity-0', 'pointer-events-none');
        UI.roomDisp.textContent = roomName;
        updateBadge();
        env.setTheme(roomName); 
        addMessage('System', `Created ${roomType} room "${roomName}".`, true);
        updateCount();
      });

      peer.on('connection', conn => {
        connections[conn.peer] = conn;
        setupConnection(conn);
        conn.on('open', () => {
          updateCount();
          showToast('Someone entered the room', 'success');
        });
      });

      peer.on('error', err => {
        if (err.type === 'unavailable-id') {
          isHost = false;
          initPeer(); // Conflict: someone else took host ID, fallback to client mode
        } else {
           UI.status.textContent = "Error: " + err.type;
        }
      });
    }

    function initPeer() {
      UI.status.textContent = "Connecting to network...";
      if (peer) peer.destroy();
      
      peer = new Peer(peerConfig);
      peer.on('open', () => {
        const conn = peer.connect(targetHostId, { reliable: true });
        let hostFound = false;
        
        conn.on('open', () => {
          hostFound = true;
          isHost = false;
          connections[targetHostId] = conn;
          setupConnection(conn);
          UI.login.classList.add('opacity-0', 'pointer-events-none');
          UI.roomDisp.textContent = roomName;
          updateBadge();
          env.setTheme(roomName);
          addMessage('System', `Entered ${roomType} room "${roomName}".`, true);
          updateCount();
        });

        // 2.5 second timeout to claim host if original host isn't there
        setTimeout(() => { 
          if (!hostFound) becomeHost(); 
        }, 2500);
      });
      
      peer.on('error', (err) => {
          if (err.type === 'peer-unavailable') {
              // Direct auto-fallback if server definitively says peer is offline
              becomeHost();
          }
      });
    }

    // --- STREAMING_CHUNK:Finalizing Interactions... ---
    UI.joinBtn.addEventListener('click', () => {
      myName = UI.userIn.value.trim();
      roomName = isJoinViaLink && roomType === 'secret' ? 'Secret Room' : UI.roomIn.value.trim();
      
      if (!myName || (!roomName && roomType !== 'secret')) return showToast("Enter Name and Room", "error");
      
      localStorage.setItem('lumina_name', myName); // Save preference
      
      const safeRoom = (UI.roomIn.value.trim() || 'secret').toLowerCase().replace(/[^a-z0-9]/g, '');
      
      // Compute Unique Identifiers based on Room Type Rules
      if (roomType === 'public') {
        targetHostId = `ltch-${safeRoom}-host-v2`; 
      } else if (roomType === 'secret') {
        if (!isJoinViaLink) roomSecretKey = generateCryptographicKey();
        targetHostId = `ltch-${safeRoom}-sec-${roomSecretKey}`;
      } else if (roomType === 'onetime') {
        if (!isJoinViaLink) roomInstanceId = generateInstanceId();
        targetHostId = `ltch-${safeRoom}-one-${roomInstanceId}`;
      } else if (roomType === 'ghost') {
        targetHostId = `ltch-${safeRoom}-gst-${ghostDuration}`;
      } else if (roomType === 'vault') {
        targetHostId = `ltch-${safeRoom}-vlt`;
      }
      
      initPeer();
    });

    UI.inviteBtn.addEventListener('click', () => {
      const url = new URL(window.location.origin + window.location.pathname);
      url.searchParams.set('room', encodeURIComponent(UI.roomIn.value.trim()));
      url.searchParams.set('type', roomType);
      
      let msg = "Invitation copied!";
      
      if (roomType === 'secret') {
        url.searchParams.set('key', roomSecretKey);
        msg = "🕵️ Secret invitation copied!";
      } else if (roomType === 'onetime') {
        url.searchParams.set('inst', roomInstanceId);
        msg = "⚡ Temporary invitation copied!";
      } else if (roomType === 'ghost') {
        url.searchParams.set('timer', ghostDuration);
        msg = "👻 Ghost room invitation copied!";
      } else if (roomType === 'vault') {
        msg = "🔐 Vault invitation copied!";
      }

      // Robust clipboard copy (handles iframe restrictions)
      const copyText = url.toString();
      if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(copyText).then(() => showToast(msg, 'success')).catch(fallBackCopy);
      } else {
          fallBackCopy();
      }

      function fallBackCopy() {
          const ta = document.createElement('textarea');
          ta.value = copyText;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try {
              document.execCommand('copy');
              showToast(msg, 'success');
          } catch (err) {
              showToast("Failed to copy link", 'error');
          }
          document.body.removeChild(ta);
      }
    });

    UI.form.addEventListener('submit', e => {
      e.preventDefault();
      const text = UI.msgIn.value.trim();
      if (!text || !peer) return;
      
      let expiresAt = null;
      if (roomType === 'ghost') expiresAt = Date.now() + (ghostDuration * 1000);

      const payload = { type: 'msg', user: myName, text, expiresAt };
      addMessage(myName, text, false, true, expiresAt);
      
      if (isHost) broadcast(payload);
      else if (connections[targetHostId]) connections[targetHostId].send(payload);
      
      UI.msgIn.value = '';
    });

    // Initialize
    parseURL();
    updateUICards();
  </script>
</body>
</html>
